# Optional paid Haiku judging; every attempt reserves two image-pair judge calls.
# Cutout requests would reserve additional judge calls. Update estimates regularly.
variants: [enhanced_2k, native_4k]
generation:
  provider: fal
  model: blackforestlabs/flux-3/klein/text-to-image
  options:
    enable_prompt_expansion: false
upscale:
  provider: fal
  model: fal-ai/esrgan
  options:
    model: RealESRGAN_x2plus
    scale: 2
segmentation: {provider: disabled}
judge: {provider: anthropic, model: claude-haiku-5-5}
policy:
  minimum_score: 0.75
  maximum_attempts: 2
  uncertain: reject
costs:
  allow_paid: true
  allow_cloud_uploads: true
  max_usd: 10
  estimates_usd:
    "generation:2k": 0.014
    "generation:4k": 0.036
    upscale: 0.015
    judge: 0.025
