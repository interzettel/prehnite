# Local-only 1K test. Replace ALL node IDs after exporting your own API graphs.
# No upscaler; output remains 768x1024 (3:4).
variants: [native_1k]
generation:
  provider: comfyui
  model: user-workflow
  options:
    base_url: http://127.0.0.1:8188
    workflow: generation_api.json
    prompt_node: "6"
    seed_node: "3"
    size_node: "5"
    output_node: "9"
segmentation:
  provider: comfyui
  model: user-segmentation
  options:
    base_url: http://127.0.0.1:8188
    workflow: cutout_api.json
    input_node: "10"
    target_node: "11"
    # For GroundingDinoSAM2Segment set target_input: prompt; for PrimitiveString set value.
    # Legacy graphs without target_input continue to use text.
    target_input: text
    output_node: "12"
upscale: {provider: disabled}
judge: {provider: demo, model: technical}
policy:
  maximum_attempts: 1
  uncertain: reject
cache: {enabled: false}
costs:
  allow_paid: false
  allow_cloud_uploads: false
  max_usd: 0
  estimates_usd: {}
