[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prehnite"
version = "0.1.0"
description = "Local-first, quality-gated visual asset production with model-agnostic providers and MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Studio Zettlerei"}]
dependencies = [
  "pydantic>=2.9,<3",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
fal = ["fal-client>=0.7,<1"]
anthropic = ["anthropic>=0.69,<1"]
mcp = ["mcp>=1.28,<3"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
prehnite = "prehnite.cli:app"
prehnite-mcp = "prehnite.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prehnite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
