[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prehnite"
dynamic = ["version"]
description = "Local-first, quality-gated visual asset production with model-agnostic providers and MCP."
readme = "docs/PYPI_README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "Studio Zettlerei"}]
dependencies = [
  "pydantic>=2.9,<3",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/interzettel/prehnite"
Documentation = "https://github.com/interzettel/prehnite/blob/main/README.md"
Source = "https://github.com/interzettel/prehnite"
Issues = "https://github.com/interzettel/prehnite/issues"
Changelog = "https://github.com/interzettel/prehnite/blob/main/CHANGELOG.md"

[project.optional-dependencies]
fal = ["fal-client>=0.7,<1"]
anthropic = ["anthropic>=0.69,<1"]
mcp = ["mcp>=1.28,<3"]
parquet = ["pyarrow>=18,<27"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "packaging>=24,<27"]

[project.scripts]
prehnite = "prehnite.cli:app"
prehnite-mcp = "prehnite.mcp_server:main"

[tool.hatch.version]
path = "src/prehnite/_version.py"

# Public sdists contain only the package and release metadata. Never ship
# local .env templates, CI internals, uploaded photos or third-party weights.
[tool.hatch.build.targets.sdist]
include = [
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
  "/docs/PYPI_README.md",
  "/src/prehnite",
]

[tool.hatch.build.targets.wheel]
packages = ["src/prehnite"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
