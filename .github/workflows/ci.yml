name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python scripts/check_governance.py
      - run: python scripts/board.py --check
      - run: python scripts/progress.py --check
      - run: python -m pip wheel --no-deps -w dist .
      - run: pytest -q
      - run: prehnite validate examples/manifest.yaml --profile examples/profile-demo.yaml

  package-smoke:
    name: Clean package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local build tooling
        run: python -m pip install build
      - name: Build wheel/sdist and exercise clean free CLI install
        run: python scripts/smoke_install.py

  mcp-windows:
    name: MCP lifecycle (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check subprocess, kernel lock and reconnect lifecycle on Windows
        run: python -m pytest -q tests/test_mcp_lifecycle.py

  offline-90:
    name: 90-asset offline benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install no-cost Python engine
        run: python -m pip install -e ".[dev]"
      - name: Execute reproducible pause/crash/reconnect/replay and ZIP checks
        run: python scripts/offline_90_benchmark.py --result-file benchmark-90.json --preview-file benchmark-90.html
      - name: Publish sanitized benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-90-${{ matrix.os }}
          path: |
            benchmark-90.json
            benchmark-90.html
          if-no-files-found: error
          retention-days: 14

  parquet-optional:
    name: Optional Parquet export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install explicitly optional Arrow support
        run: python -m pip install -e ".[dev,parquet]"
      - name: Validate typed schemas, privacy, opt-in and archive tamper protection
        run: python -m pytest -q tests/test_optional_parquet.py tests/test_analytics_dashboard.py
      - name: Exercise 90-slot crash/recovery with explicit Parquet packaging
        run: python scripts/offline_90_benchmark.py --parquet --result-file benchmark-parquet-90.json --parquet-output synthetic-parquet-90
      - name: Publish synthetic columnar sample for review
        uses: actions/upload-artifact@v4
        with:
          name: parquet-90-${{ matrix.os }}
          path: |
            synthetic-parquet-90/
            benchmark-parquet-90.json
          if-no-files-found: error
          retention-days: 14
