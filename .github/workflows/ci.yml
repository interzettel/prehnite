name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python scripts/check_governance.py
      - run: python scripts/board.py --check
      - run: python scripts/progress.py --check
      - run: python -m pip wheel --no-deps -w dist .
      - run: pytest -q
      - run: prehnite validate examples/manifest.yaml --profile examples/profile-demo.yaml

  package-smoke:
    name: Clean package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local build tooling
        run: python -m pip install build
      - name: Build wheel/sdist and exercise clean free CLI install
        run: python scripts/smoke_install.py
