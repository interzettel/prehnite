name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python scripts/check_governance.py
      - run: python scripts/board.py --check
      - run: python scripts/progress.py --check
      - run: python scripts/atomic_progress.py --check
      - run: python scripts/model_rights.py --check
      - run: python scripts/recipe_plan.py --recipe recipes/prehnite-micro/0.1.0-preview.1.json
      - run: python scripts/recipe_plan.py --recipe recipes/prehnite-macro/0.1.0-preview.1.json
      - run: python -m pip wheel --no-deps -w dist .
      - run: pytest -q
      - run: prehnite validate examples/manifest.yaml --profile examples/profile-demo.yaml

  package-smoke:
    name: Clean package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local build tooling
        run: python -m pip install build
      - name: Build wheel/sdist and exercise clean free CLI install
        run: python scripts/smoke_install.py

  mcp-windows:
    name: MCP lifecycle (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check subprocess, kernel lock and reconnect lifecycle on Windows
        run: python -m pytest -q tests/test_mcp_lifecycle.py

  offline-90:
    name: 90-asset offline benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install no-cost Python engine
        run: python -m pip install -e ".[dev]"
      - name: Execute reproducible pause/crash/reconnect/replay and ZIP checks
        run: python scripts/offline_90_benchmark.py --result-file benchmark-90.json --preview-file benchmark-90.html --native-preview-file benchmark-native.html
      - name: Prepare private-safe synthetic pixel-grid comparison preview
        run: python scripts/synthetic_pixel_diff_demo.py --output pixel-diff-synthetic
      - name: Verify synthetic 4K attested translation and export diagnostic evidence
        run: python scripts/synthetic_alignment_demo.py --output alignment-4k-synthetic
      - name: Publish sanitized benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-90-${{ matrix.os }}
          path: |
            benchmark-90.json
            benchmark-90.html
            benchmark-native.html
            pixel-diff-synthetic/
            alignment-4k-synthetic/
          if-no-files-found: error
          retention-days: 14

  parquet-optional:
    name: Optional Parquet export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install explicitly optional Arrow support
        run: python -m pip install -e ".[dev,parquet]"
      - name: Validate typed schemas, privacy, opt-in and archive tamper protection
        run: python -m pytest -q tests/test_optional_parquet.py tests/test_analytics_dashboard.py
      - name: Exercise 90-slot crash/recovery with explicit Parquet packaging
        run: python scripts/offline_90_benchmark.py --parquet --result-file benchmark-parquet-90.json --parquet-output synthetic-parquet-90
      - name: Publish synthetic columnar sample for review
        uses: actions/upload-artifact@v4
        with:
          name: parquet-90-${{ matrix.os }}
          path: |
            synthetic-parquet-90/
            benchmark-parquet-90.json
          if-no-files-found: error
          retention-days: 14

  repair-demo:
    name: Synthetic local repair evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only local open-source test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test alpha repair, crash recovery and portrait abstention
        run: python -m pytest -q tests/test_repair.py tests/test_decision_engine.py tests/test_engine_local_repair.py
      - name: Generate self-contained zero-network before/after report
        run: python scripts/repair_demo.py --workspace repair-demo-evidence
      - name: Publish synthetic demonstration only (no user image data)
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-repair-${{ matrix.os }}
          path: |
            repair-demo-evidence/evidence/experiment-001/
          if-no-files-found: error
          retention-days: 14

  cutout-challenge-matrix:
    name: Hard cutout synthetic matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify original repair plus hard-case refusal and reference metrics
        run: python -m pytest -q tests/test_repair.py tests/test_repair_challenges.py
      - name: Generate 20-case interactive-free HTML/JSON evidence
        run: python scripts/repair_challenge_benchmark.py --workspace synthetic-challenge-evidence
      - name: Upload synthetic-only challenge receipts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-challenges-${{ matrix.os }}
          path: |
            synthetic-challenge-evidence/evidence/experiment-002/
          if-no-files-found: error
          retention-days: 14

  real-alpha-local-evaluator:
    name: Real alpha intake security fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify refusal, alpha metrics, privacy and no output mutation
        run: python -m pytest -q tests/test_real_cutout_eval.py tests/test_private_source_preflight.py tests/test_inspect_apparel_pilot.py tests/test_review_intake.py
      - name: Verify blueprint DAG, model scope and no-spend constraints
        run: python -m pytest -q tests/test_recipes.py
      - name: Verify external-model terms provenance and fail-closed rights
        run: python -m pytest -q tests/test_model_rights.py && python scripts/model_rights.py --check

  license-sbom:
    name: Offline dependency license inventory (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install editable local engine and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture actual environment dependency resolution
        shell: bash
        run: python -m pip inspect --local > dependency-inspect.json
      - name: Generate exact-version SBOM and unresolved license report
        run: python scripts/dependency_sbom.py --inspect dependency-inspect.json --extras dev --output license-inventory
      - name: Fail if the generated SBOM omits dependencies or mislabels clearance
        run: python -m pytest -q tests/test_dependency_sbom.py
      - name: Preserve sanitized evidence (no local package paths or tokens)
        uses: actions/upload-artifact@v4
        with:
          name: dependency-license-${{ matrix.os }}
          path: license-inventory/
          if-no-files-found: error
          retention-days: 14
  recipe-journal-bridge:
    name: Recipe/engine journal identity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Check recipe pinning, replay and fail-closed model profile mapping
        run: python -m pytest -q tests/test_recipe_execution.py tests/test_recipe_resolver.py
      - name: Check explicit CLI run flags are discoverable
        run: prehnite run --help

  local-recipe-resolver:
    name: Offline micro model resolver (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Validate local hash and rights refusal fixtures
        run: python -m pytest -q tests/test_recipes.py tests/test_recipe_resolver.py
      - name: Ensure read-only resolver CLI can report help
        run: prehnite recipe-resolve --help

  hardware-doctor:
    name: Read-only hardware doctor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Assert observed/unknown hardware probe invariants
        run: python -m pytest -q tests/test_hardware.py
      - name: Verify offline CLI is usable on this runner (not a performance benchmark)
        run: prehnite hardware


  release-dist-audit:
    name: Inspect wheel and sdist (no publication)
    runs-on: ubuntu-latest
    needs: [unit, package-smoke]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packaging and metadata inspection tools
        run: python -m pip install build twine packaging
      - name: Build exact distribution archives
        run: python -m build --outdir dist
      - name: Validate archive metadata, source and excluded private material
        run: python scripts/check_release_artifacts.py
      - name: Validate rendered PyPI metadata
        run: python -m twine check --strict dist/*
      - name: Preserve unsigned candidate artifacts for human review
        uses: actions/upload-artifact@v4
        with:
          name: candidate-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7


  published-alpha-smoke:
    name: Install live PyPI 0.1.0a1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Download the exact public wheel, hash it and install it into a clean virtualenv
        run: python scripts/smoke_public_pypi.py
