name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q src
      - run: python scripts/check_governance.py
      - run: python scripts/board.py --check
      - run: python scripts/progress.py --check
      - run: python scripts/atomic_progress.py --check
      - run: python scripts/model_rights.py --check
      - run: python -m pip wheel --no-deps -w dist .
      - run: pytest -q
      - run: prehnite validate examples/manifest.yaml --profile examples/profile-demo.yaml

  package-smoke:
    name: Clean package install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local build tooling
        run: python -m pip install build
      - name: Build wheel/sdist and exercise clean free CLI install
        run: python scripts/smoke_install.py

  mcp-windows:
    name: MCP lifecycle (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package and offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check subprocess, kernel lock and reconnect lifecycle on Windows
        run: python -m pytest -q tests/test_mcp_lifecycle.py

  offline-90:
    name: 90-asset offline benchmark (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install no-cost Python engine
        run: python -m pip install -e ".[dev]"
      - name: Execute reproducible pause/crash/reconnect/replay and ZIP checks
        run: python scripts/offline_90_benchmark.py --result-file benchmark-90.json --preview-file benchmark-90.html --native-preview-file benchmark-native.html
      - name: Prepare private-safe synthetic pixel-grid comparison preview
        run: python scripts/synthetic_pixel_diff_demo.py --output pixel-diff-synthetic
      - name: Verify synthetic 4K attested translation and export diagnostic evidence
        run: python scripts/synthetic_alignment_demo.py --output alignment-4k-synthetic
      - name: Publish sanitized benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: offline-90-${{ matrix.os }}
          path: |
            benchmark-90.json
            benchmark-90.html
            benchmark-native.html
            pixel-diff-synthetic/
            alignment-4k-synthetic/
          if-no-files-found: error
          retention-days: 14

  parquet-optional:
    name: Optional Parquet export (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install explicitly optional Arrow support
        run: python -m pip install -e ".[dev,parquet]"
      - name: Validate typed schemas, privacy, opt-in and archive tamper protection
        run: python -m pytest -q tests/test_optional_parquet.py tests/test_analytics_dashboard.py
      - name: Exercise 90-slot crash/recovery with explicit Parquet packaging
        run: python scripts/offline_90_benchmark.py --parquet --result-file benchmark-parquet-90.json --parquet-output synthetic-parquet-90
      - name: Publish synthetic columnar sample for review
        uses: actions/upload-artifact@v4
        with:
          name: parquet-90-${{ matrix.os }}
          path: |
            synthetic-parquet-90/
            benchmark-parquet-90.json
          if-no-files-found: error
          retention-days: 14

  repair-demo:
    name: Synthetic local repair evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install only local open-source test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test alpha repair, crash recovery and portrait abstention
        run: python -m pytest -q tests/test_repair.py tests/test_decision_engine.py
      - name: Generate self-contained zero-network before/after report
        run: python scripts/repair_demo.py --workspace repair-demo-evidence
      - name: Publish synthetic demonstration only (no user image data)
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-repair-${{ matrix.os }}
          path: |
            repair-demo-evidence/evidence/experiment-001/
          if-no-files-found: error
          retention-days: 14

  cutout-challenge-matrix:
    name: Hard cutout synthetic matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify original repair plus hard-case refusal and reference metrics
        run: python -m pytest -q tests/test_repair.py tests/test_repair_challenges.py
      - name: Generate 20-case interactive-free HTML/JSON evidence
        run: python scripts/repair_challenge_benchmark.py --workspace synthetic-challenge-evidence
      - name: Upload synthetic-only challenge receipts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-challenges-${{ matrix.os }}
          path: |
            synthetic-challenge-evidence/evidence/experiment-002/
          if-no-files-found: error
          retention-days: 14

  real-alpha-local-evaluator:
    name: Real alpha intake security fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify refusal, alpha metrics, privacy and no output mutation
        run: python -m pytest -q tests/test_real_cutout_eval.py tests/test_private_source_preflight.py tests/test_inspect_apparel_pilot.py
      - name: Verify external-model license provenance and fail-closed rights
        run: python -m pytest -q tests/test_model_rights.py && python scripts/model_rights.py --check
