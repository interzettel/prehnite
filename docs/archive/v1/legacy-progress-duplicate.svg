<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 325" role="img" aria-labelledby="title desc">
<title id="title">Prehnite release gate readiness: 4 verified, 7 partial, 5 unverified of 16</title>
<desc id="desc">A segmented evidence chart. This is not a percentage of engineering completion or visual model performance. CI validates offline demo features only.</desc>
<rect width="940" height="325" rx="20" fill="#111827"/>
<g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
<text x="32" y="55" font-size="29" font-weight="700" fill="#f8fafc">Prehnite / Release gates</text>
<text x="32" y="82" font-size="15" fill="#a7b3c8">16 evidence gates · unweighted · 2026-10-16</text>
<g transform="translate(32 113)">
<rect x="0" y="0" width="216" height="46" rx="7" fill="#188969"/>
<rect x="223" y="0" width="377" height="46" rx="7" fill="#bd8b32"/>
<rect x="607" y="0" width="269" height="46" rx="7" fill="#46536b"/>
<text x="108" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#fff">4 verified</text>
<text x="412" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#111827">7 partial</text>
<text x="741" y="29" font-size="15" font-weight="600" text-anchor="middle" fill="#fff">5 unverified</text>
</g>
<text x="32" y="197" font-size="16" fill="#f1f5f9" font-weight="600">Evidence is not production readiness.</text>
<text x="32" y="223" font-size="14" fill="#a7b3c8">Green: reproduced in offline CI  ·  Amber: implementation without full validation</text>
<text x="32" y="245" font-size="14" fill="#a7b3c8">Grey: not yet demonstrated  ·  90-asset / GPU / real billing tests remain open</text>
<path d="M32 269 H908" stroke="#344256"/>
<text x="32" y="294" font-size="13" fill="#c1ccdc">No automatic paid inference · One bounded PR at a time · A2A issue #9</text>
</g>
</svg>
