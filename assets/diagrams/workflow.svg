<title id="title">Prehnite architecture and existing generation backends</title>
<desc id="desc">Prompt and asset requirements enter Prehnite, which manages recipes, budget, journal and outputs. Execution is explicitly selected from local ComfyUI, optional fal.ai or offline demo. Optional Anthropic judging is not an image generator.</desc>
