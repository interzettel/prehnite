<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wtitle wdesc" viewBox="0 0 1350 428">
<title id="wtitle">Prehnite workflow: input to human acceptance</title>
<desc id="wdesc">Inputs become a tracked Prehnite manifest. A separately installed runtime produces candidate images. Prehnite preserves evidence and packages results for human review.</desc>
<rect width="1350" height="428" fill="#F6EFE2"/>
<text x="44" y="55" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#075231">THE IMAGE WORKFLOW</text>
<text x="44" y="84" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#53675A">Reuse the runtime. Own the process.</text>
<rect x="44" y="102" width="72" height="4" rx="2" fill="#F7655B"/>
<rect x="44" y="135" width="200" height="220" rx="8" fill="#FFF9EC" stroke="#D8CBB8" stroke-width="1.5"/><text x="62" y="171" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#A63D35">01</text><text x="62" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#075231">INPUT</text><text x="62" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53675A">Your intentions</text><line x1="62" x2="226" y1="252" y2="252" stroke="#D8CBB8"/><text x="62" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Prompts and references</text><text x="62" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Batch goals</text><text x="62" y="324" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Accepted quality bar</text><path d="M252 245h21m-10 -8 10 8 -10 8" stroke="#075231" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="285" y="135" width="309" height="220" rx="8" fill="#EAF1E6" stroke="#075231" stroke-width="1.5"/><text x="303" y="171" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#A63D35">02</text><text x="303" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#075231">PREHNITE</text><text x="303" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53675A">Plan, track, and preserve</text><line x1="303" x2="576" y1="252" y2="252" stroke="#D8CBB8"/><text x="303" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Manifest, recipes, provenance</text><text x="303" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Resource and spend guards</text><text x="303" y="324" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Journal and safe recovery</text><text x="303" y="347" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Quality review and packaging</text><path d="M602 245h20m-10 -8 10 8 -10 8" stroke="#075231" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="634" y="135" width="188" height="220" rx="8" fill="#FFF9EC" stroke="#D8CBB8" stroke-width="1.5"/><text x="652" y="171" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#A63D35">03</text><text x="652" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#075231">RUNTIME</text><text x="652" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53675A">Execution backend</text><line x1="652" x2="804" y1="252" y2="252" stroke="#D8CBB8"/><text x="652" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">ComfyUI, local</text><text x="652" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Hosted API, opt-in</text><text x="652" y="324" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">No model weights bundled</text><path d="M830 245h20m-10 -8 10 8 -10 8" stroke="#075231" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="862" y="135" width="200" height="220" rx="8" fill="#FFF9EC" stroke="#D8CBB8" stroke-width="1.5"/><text x="880" y="171" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#A63D35">04</text><text x="880" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#075231">OUTPUT</text><text x="880" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53675A">Versioned deliverables</text><line x1="880" x2="1044" y1="252" y2="252" stroke="#D8CBB8"/><text x="880" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Image candidates</text><text x="880" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Evidence and metrics</text><text x="880" y="324" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Report and ZIP</text><path d="M1070 245h20m-10 -8 10 8 -10 8" stroke="#075231" stroke-width="2" fill="none" stroke-linejoin="round"/><rect x="1102" y="135" width="204" height="220" rx="8" fill="#FFF9EC" stroke="#D8CBB8" stroke-width="1.5"/><text x="1120" y="171" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" fill="#A63D35">05</text><text x="1120" y="209" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#075231">HUMAN</text><text x="1120" y="237" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#53675A">Acceptance</text><line x1="1120" x2="1288" y1="252" y2="252" stroke="#D8CBB8"/><text x="1120" y="278" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Inspect and compare</text><text x="1120" y="301" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Select useful images</text><text x="1120" y="324" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#53675A">Reuse the recipe</text>
<text x="44" y="403" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#075231">Local by default</text>
<text x="206" y="403" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" fill="#53675A">Real GPU quality and speed require separate evidence</text>
