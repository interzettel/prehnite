<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1340 675">
<title id="title">Prehnite two-phase roadmap with verified task counts</title>
<desc id="desc">43 of 63 engineering evidence tasks have been verified, while only the foundation outcome has been accepted. Phase 1 has six milestones, including model, hardware, optimization, batching and quality gates. Phase 2 has three unaccepted LoRA and appearance milestones. Each card shows verified supporting tasks and whether the complete outcome has been accepted.</desc>
