<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rtitle rdesc" viewBox="0 0 1350 530">
<title id="rtitle">Prehnite two-phase product roadmap</title><desc id="rdesc">Phase 1 contains the verified foundation followed by five planned milestones. Phase 2 has three planned LoRA and private appearance milestones. Only foundation is complete.</desc>
